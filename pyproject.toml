[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sightline"
version = "1.0.0"
description = "Advisory video perception pipeline: person detection, tracking and corridor events with honest degraded states."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Huda Mueen" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
    "motmetrics>=1.4.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# the detector is optional so tests and replay-from-cache run without torch
detector = ["torch>=2.4", "torchvision>=0.19"]
# YOLOX ONNX exports (Apache-2.0) through ONNX Runtime (MIT); weights go in weights/yolox/
onnx = ["onnxruntime>=1.20"]
# IndoorCrowd ships as parquet; only the importer needs this
indoorcrowd = ["pyarrow>=15"]
dev = ["pytest>=8.0", "torch>=2.4", "torchvision>=0.19", "pyarrow>=15"]
# OpenCV with window support, for draw-corridor and label-events. It ships the same `cv2`
# package as the headless default, so the two must never be installed together: after
# installing this extra, follow the README ("OpenCV with a GUI") to keep only this one.
gui = ["opencv-python>=4.9"]

[tool.setuptools.packages.find]
include = ["sightline*"]

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
# Pyflakes only: unused imports, undefined names and similar real mistakes. Style rules are not enforced.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
