# Runs the whole test suite on every push and pull request. The tests use a synthetic clip
# generated in the run, so no dataset, video or model weight is needed (none are in git).
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only torch, so the runner does not pull CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -c constraints.txt -e ".[dev]"
          pip install ruff
      - name: Lint (pyflakes rules only)
        run: ruff check sightline tests
      - name: Test
        run: python -m pytest -q
