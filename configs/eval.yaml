# Evaluation constants. These define what the LABELS mean. They are fixed in
# advance and are never tuned against the system's results.

detection:
  iou: 0.5

tracking:
  iou: 0.5

# who counts as "in scope" (PLAN.md amendment A1, 2026-10-14). Out-of-scope people
# become ignore regions for in-scope scoring; results are reported in scope AND all boxes.
in_scope:
  min_height_frac: 0.10     # box height >= 10% of the source frame height
  min_visibility: 0.65      # Caltech "Reasonable" precedent

gt_events:
  # rule used to derive event labels from ground-truth boxes (MOT17 and IndoorCrowd clips).
  # In seconds (PLAN.md A6, 2026-10-17), converted per clip at its own fps, rounding half up:
  # 0.1 s and 0.1667 s are exactly the old 3 and 5 frames at 30 fps, so no 30 fps label changes;
  # at 5 fps (IndoorCrowd) they are 1 and 1 frame. The frame values are kept as the fallback.
  min_s: 0.1
  merge_gap_s: 0.1667
  min_frames: 3
  merge_gap: 5

bar:
  # the acceptance bar from the Task 03 brief
  min_heldout_clips: 12
  min_difficult_conditions: 3
  detection_precision: 0.80
  detection_recall: 0.80
  detection_bar_dataset: own   # judged on held-out OWN corridor clips, in scope (A1); MOT17 is reported, not judged
  idf1: 0.65
  event_precision: 0.85
  event_recall: 0.85
  max_false_events_per_5min_negative: 1.0
  median_event_latency_frames: 5
  min_fps: 10.0

conditions:
  difficult: [occlusion_crowding, camera_motion_blur, low_light_compression]
