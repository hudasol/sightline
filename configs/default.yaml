# Default parameters. These are STARTING values. The real values come from
# `python -m sightline tune` (val only, after a final lock) and are written to results/frozen_config.yaml.
# Never edit frozen_config.yaml by hand after the held-out manifest is locked.

detector:
  # chosen by PLAN.md A4 on MOT17 val (A6.8): results/detector_selection/a4_choice.json
  name: yolox_s             # YOLOX-s, ONNX Runtime; weights/yolox/yolox_s.onnx (git-ignored)
  score_threshold: 0.5      # FROZEN-ON-VAL (tune sets it from the in-scope val sweep)
  min_score: 0.1
  input_size: [640, 640]    # YOLOX-s's fixed square input, letterboxed
  device: cpu
  torch_threads: 8          # intra-op threads; the A4 runs used 8

tracker:
  kind: bytetrack
  new_track_score: 0.6
  match_iou: 0.3
  low_match_iou: 0.5
  tentative_match_iou: 0.5
  max_age: 30               # detector frames; superseded by max_age_s when set
  max_age_s: 1.0            # FROZEN-ON-VAL. seconds; = 30 frames at 30 fps with detect_every 1
  min_hits: 3               # FROZEN-ON-VAL
  trajectory_len: 30

events:
  # frame counts below are superseded by the *_s seconds, converted at each clip's fps.
  # The seconds equal the frame counts at 30 fps, so behaviour there is unchanged.
  n_open: 3
  m_close: 5
  cooldown: 15
  open_s: 0.1               # FROZEN-ON-VAL (3 frames at 30 fps)
  close_s: 0.167            # FROZEN-ON-VAL (5 frames at 30 fps)
  cooldown_s: 0.5           # (15 frames at 30 fps)
  edge_margin_frac: 0.05

health:
  min_fps: 10.0
  gap_factor: 3.0
  stall_seconds: 2.0
  k_corrupt: 5
  corrupt_window: 30
  recover_frames: 15
  min_luminance: 35.0       # FROZEN-ON-VAL
  min_sharpness: 25.0       # FROZEN-ON-VAL
  low_conf_window: 30
  low_conf_mean: 0.35       # FROZEN-ON-VAL
  fps_window: 30
  warmup_frames: 5
  max_detection_age_s: 0.5 # declared, not tuned: the corridor status rests on a detection <= 0.5 s old

pipeline:
  detect_every: 3           # A4 choice: smallest k at >= 10 fps (median of 3); tracker predicts between (A2)
  declared_width: 640
  declared_height: 360
  decode_thread: true       # decode ahead in a background thread; order kept, nothing dropped
  decode_queue: 4

# the baseline tracker is tuned on the same grid as the chosen one
baseline_tracker:
  kind: iou
  new_track_score: 0.6
  match_iou: 0.3
  max_age: 30
  max_age_s: 1.0            # same time-based patience as the chosen tracker
  min_hits: 3
